<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lk_uni</title>
  <style>
    :root { color-scheme: light dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; --blue:#2563eb; --ink:#111827; --muted:#6b7280; --line:#e5e7eb; --card:#fff; --bg:#f6f8fb; }
    * { box-sizing: border-box; }
    body { margin:0; padding:16px; color:var(--ink); background:linear-gradient(145deg,#eff6ff,var(--bg)); }
    main { max-width:720px; margin:auto; border:1px solid var(--line); border-radius:24px; background:var(--card); overflow:hidden; box-shadow:0 18px 55px #0f172a14; }
    header { display:flex; align-items:center; justify-content:space-between; gap:14px; padding:20px 22px; color:#fff; background:linear-gradient(135deg,#2563eb,#0f172a); }
    .brand { display:flex; align-items:center; gap:12px; }
    .logo { width:42px; height:42px; display:grid; place-items:center; border-radius:13px; background:#ffffff24; font-weight:900; }
    h1 { margin:0; font-size:19px; } header p { margin:3px 0 0; font-size:12px; color:#ffffffb8; }
    .demo { padding:7px 10px; border:1px solid #ffffff40; border-radius:999px; font-size:11px; font-weight:800; }
    nav { display:grid; grid-template-columns:repeat(3,1fr); gap:7px; padding:12px; border-bottom:1px solid var(--line); }
    button { appearance:none; border:0; border-radius:12px; padding:11px 10px; cursor:pointer; font:inherit; font-weight:700; color:var(--muted); background:#f3f4f6; }
    button.active { color:#fff; background:var(--ink); }
    button:disabled { opacity:.55; cursor:wait; }
    section { min-height:290px; padding:24px; }
    .eyebrow { color:var(--blue); font-size:11px; font-weight:900; letter-spacing:.1em; text-transform:uppercase; }
    h2 { margin:8px 0 6px; font-size:28px; letter-spacing:-.04em; }
    .sub { margin:0 0 22px; color:var(--muted); line-height:1.55; }
    .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
    .card { padding:16px; border:1px solid var(--line); border-radius:16px; background:#fff; }
    .card strong,.card span { display:block; } .card span { margin-top:5px; color:var(--muted); font-size:13px; }
    .pill { display:inline-flex !important; width:max-content; margin-top:9px !important; padding:5px 8px; border-radius:999px; color:#166534 !important; background:#dcfce7; font-size:11px !important; font-weight:800; }
    .pill.off { color:#92400e !important; background:#fef3c7; }
    .score { display:flex; align-items:center; gap:18px; padding:18px; border-radius:18px; color:#fff; background:linear-gradient(135deg,#2563eb,#0f172a); }
    .score b { font-size:44px; } .score span { color:#ffffffb8; }
    ul { margin:16px 0 0; padding-left:20px; color:var(--muted); } li+li { margin-top:8px; }
    .empty { display:grid; place-items:center; min-height:220px; text-align:center; color:var(--muted); }
    @media (max-width:520px){ body{padding:0} main{border-radius:0}.grid{grid-template-columns:1fr}section{padding:20px}nav button{font-size:12px} }
    @media (prefers-color-scheme:dark){ :root{--ink:#f9fafb;--muted:#9ca3af;--line:#374151;--card:#111827;--bg:#030712}.card{background:#1f2937}button{background:#1f2937}button.active{background:#2563eb} }
  </style>
</head>
<body>
<main>
  <header><div class="brand"><div class="logo">LK</div><div><h1>Lk_uni</h1><p>Identity Platform в ChatGPT</p></div></div><span class="demo">DEMO v0.1</span></header>
  <nav><button data-tool="get_my_access_summary" class="active">Мой доступ</button><button data-tool="get_my_profile">Профиль</button><button data-tool="get_security_status">Безопасность</button></nav>
  <section id="content"><div class="empty">Загружаю кабинет…</div></section>
</main>
<script type="module">
  const content = document.querySelector('#content');
  const buttons = [...document.querySelectorAll('[data-tool]')];
  let rpcId = 0;
  const pending = new Map();
  const esc = (value) => String(value ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  const request = (method, params) => new Promise((resolve,reject) => { const id=++rpcId; pending.set(id,{resolve,reject}); parent.postMessage({jsonrpc:'2.0',id,method,params},'*'); });
  const notify = (method,params) => parent.postMessage({jsonrpc:'2.0',method,params},'*');
  const setBusy = (busy) => buttons.forEach(b => b.disabled = busy);
  function render(data){
    if(!data) return;
    buttons.forEach(b=>b.classList.toggle('active', b.dataset.tool === ({access:'get_my_access_summary',profile:'get_my_profile',security:'get_security_status'}[data.view])));
    if(data.view==='access'){
      const a=data.access;
      content.innerHTML=`<div class="eyebrow">User App · ${esc(a.projectName)}</div><h2>Мой доступ</h2><p class="sub">Режим: преимущественно чтение. Системные настройки защищены.</p><div class="grid"><div class="card"><strong>Разрешено</strong>${a.allowedActions.map(x=>`<span>✓ ${esc(x)}</span>`).join('')}</div><div class="card"><strong>Защищено</strong>${a.protectedScopes.map(x=>`<span>🔒 ${esc(x)}</span>`).join('')}</div></div>`;
    } else if(data.view==='profile'){
      const p=data.profile;
      content.innerHTML=`<div class="eyebrow">Профиль</div><h2>${esc(p.displayName)}</h2><p class="sub">Статус: ${esc(p.status)} · ID: ${esc(p.id)}</p><div class="grid">${p.identities.map(x=>`<div class="card"><strong>${esc(x.provider.toUpperCase())}</strong><span>${esc(x.label)}</span><span class="pill ${x.verified?'':'off'}">${x.verified?'Подтверждён':'Не привязан'}</span></div>`).join('')}</div>`;
    } else if(data.view==='security'){
      const s=data.security;
      content.innerHTML=`<div class="eyebrow">Безопасность</div><h2>Состояние аккаунта</h2><p class="sub">Активных сессий: ${esc(s.activeSessions)} · последний вход: ${new Date(s.lastLogin).toLocaleString('ru-RU')}</p><div class="score"><b>${esc(s.score)}</b><div><strong>из 100</strong><br><span>Хороший уровень защиты</span></div></div><ul>${s.recommendations.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
    }
  }
  function update(response){ render(response?.structuredContent); }
  addEventListener('message', event => {
    if(event.source!==parent || event.data?.jsonrpc!=='2.0') return;
    const m=event.data;
    if(typeof m.id==='number'){ const p=pending.get(m.id); if(!p)return; pending.delete(m.id); m.error?p.reject(m.error):p.resolve(m.result); }
    if(m.method==='ui/notifications/tool-result') update(m.params);
  }, {passive:true});
  const ready=request('ui/initialize',{appInfo:{name:'lk-uni-dashboard',version:'0.1.0'},appCapabilities:{},protocolVersion:'2026-01-26'}).then(()=>notify('ui/notifications/initialized',{}));
  async function call(name){ setBusy(true); try{ await ready; const result=await request('tools/call',{name,arguments:{}}); update(result); } catch(error){ content.innerHTML=`<div class="empty">Не удалось загрузить данные.<br>${esc(error?.message || 'Повторите попытку')}</div>`; } finally{ setBusy(false); } }
  buttons.forEach(button=>button.addEventListener('click',()=>call(button.dataset.tool)));
  ready.then(()=>call('get_my_access_summary'));
</script>
</body>
</html>
