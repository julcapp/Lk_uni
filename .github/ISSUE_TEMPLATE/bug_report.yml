name: Сообщение об ошибке
description: Сообщить о воспроизводимом дефекте Lk_uni
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Спасибо за сообщение. Не публикуйте секреты, токены и персональные данные.
  - type: input
    id: version
    attributes:
      label: Версия или ветка
      placeholder: main, commit SHA или версия
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Описание ошибки
      description: Что произошло?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Окружение
      description: ОС, Node.js, PostgreSQL, Docker и другие существенные версии
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Проверка
      options:
        - label: Я проверил существующие Issues
          required: true
        - label: Я удалил секреты и персональные данные
          required: true
        - label: Это не сообщение об уязвимости безопасности
          required: true
