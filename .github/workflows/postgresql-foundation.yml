name: PostgreSQL Foundation

on:
  push:
    branches:
      - feature/postgresql-foundation
  pull_request:
    paths:
      - "backend/**"
      - "docker-compose.postgres.yml"
      - ".github/workflows/postgresql-foundation.yml"

permissions:
  contents: read

jobs:
  migration:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lk_uni_test
          POSTGRES_USER: lk_uni
          POSTGRES_PASSWORD: lk_uni_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lk_uni -d lk_uni_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://lk_uni:lk_uni_test@127.0.0.1:5432/lk_uni_test
      DATABASE_SSL: "false"
      DB_POOL_MIN: 1
      DB_POOL_MAX: 4

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Run in-memory migration contract test
        run: npm run db:test

      - name: Apply migrations to PostgreSQL 16
        run: npm run db:migrate

      - name: Seed DevHub
        run: npm run db:seed

      - name: Check PostgreSQL connection
        run: npm run db:check

      - name: Roll back migration
        run: npm run db:rollback

      - name: Re-apply migration after rollback
        run: npm run db:migrate
