<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lk_uni</title><style>:root{font-family:Inter,Arial,sans-serif;color:#172033;background:#f4f7fb}*{box-sizing:border-box}body{margin:0;background:#f4f7fb}button,input,select{font:inherit}.top{height:68px;background:#fff;border-bottom:1px solid #e6ebf2;display:flex;align-items:center;justify-content:space-between;padding:0 28px}.brand{font-size:22px;font-weight:800}.top-actions{display:flex;gap:10px}.layout{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 68px)}.side{background:#fff;border-right:1px solid #e6ebf2;padding:24px 18px}.nav{display:grid;gap:8px}.nav a{padding:12px 14px;border-radius:12px;color:#465166;text-decoration:none;font-weight:700}.nav a.active,.nav a:hover{background:#eef4ff;color:#2458d3}.main{padding:34px;max-width:1050px}.eyebrow{color:#2458d3;font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}h1{font-size:38px;margin:10px 0 8px}.lead{color:#667085;margin:0 0 28px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:22px;margin-bottom:18px}.card h2{margin:0 0 18px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.field{display:grid;gap:7px}.field label{font-weight:700}.field input,.field select{padding:12px 13px;border:1px solid #ccd5e2;border-radius:12px;background:#fff}.readonly{background:#f7f8fa!important;color:#667085}.actions{display:flex;gap:10px;margin-top:18px}.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:800;cursor:pointer}.primary{background:#2458d3;color:#fff}.secondary{background:#edf1f7;color:#26334b}.lang{background:#fff;border:1px solid #dce3ee}.danger{background:#fff0ef;color:#b42318}.notice{padding:12px 14px;border-radius:12px;margin-bottom:18px}.ok{background:#ecfdf3;color:#027a48}.error{background:#fff0ef;color:#b42318}.hidden{display:none}.session{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:14px 0;border-top:1px solid #edf0f5}.muted{color:#667085;font-size:14px}@media(max-width:800px){.layout{grid-template-columns:1fr}.side{display:none}.main{padding:24px}.grid{grid-template-columns:1fr}.top{padding:0 18px}}</style></head><body>
<header class="top"><div class="brand">Lk_uni</div><div class="top-actions"><button id="langButton" class="btn lang"></button><button id="logout" class="btn secondary"></button></div></header><div class="layout"><aside class="side"><nav class="nav"><a id="navHome" href="/workspace/"></a><a id="navProfile" class="active" href="/profile/"></a><a id="navOrganization" href="/organization/"></a><a id="navMembers" href="#"></a></nav></aside><main class="main"><div id="eyebrow" class="eyebrow"></div><h1 id="pageTitle"></h1><p id="lead" class="lead"></p><div id="notice" class="notice hidden"></div><section class="card"><h2 id="basicTitle"></h2><form id="profileForm"><div class="grid"><div class="field"><label id="displayNameLabel" for="displayName"></label><input id="displayName" required maxlength="120"></div><div class="field"><label id="phoneLabel" for="phone"></label><input id="phone" autocomplete="tel" placeholder="+7 900 000-00-00"></div><div class="field"><label for="email">Email</label><input id="email" class="readonly" readonly></div></div><div class="actions"><button id="saveProfile" class="btn primary" type="submit"></button></div></form></section><section class="card"><h2 id="settingsTitle"></h2><form id="settingsForm"><div class="grid"><div class="field"><label id="languageLabel" for="language"></label><select id="language"><option value="ru">Русский</option><option value="en">English</option></select></div><div class="field"><label id="timezoneLabel" for="timezone"></label><input id="timezone" value="Europe/Moscow"></div></div><div class="actions"><button id="saveSettings" class="btn primary" type="submit"></button></div></form></section><section class="card"><h2 id="passwordTitle"></h2><form id="passwordForm"><div class="grid"><div class="field"><label id="currentPasswordLabel" for="currentPassword"></label><input id="currentPassword" type="password" autocomplete="current-password" required></div><div class="field"><label id="newPasswordLabel" for="newPassword"></label><input id="newPassword" type="password" autocomplete="new-password" minlength="8" required></div></div><div class="actions"><button id="changePasswordButton" class="btn primary" type="submit"></button></div></form></section><section class="card"><h2 id="sessionsTitle"></h2><div id="sessions"><p class="muted"></p></div></section></main></div>
<script src="/shared/i18n.js"></script><script>
const T={ru:{title:'Lk_uni — профиль',logout:'Выйти',home:'Главная',profile:'Профиль',organization:'Организация',members:'Участники',eyebrow:'Личный кабинет',pageTitle:'Мой профиль',lead:'Основные данные, настройки и безопасность учётной записи.',basic:'Основные данные',display:'Отображаемое имя',phone:'Телефон',saveProfile:'Сохранить профиль',settings:'Настройки',language:'Язык интерфейса',timezone:'Часовой пояс',saveSettings:'Сохранить настройки',password:'Смена пароля',current:'Текущий пароль',next:'Новый пароль',change:'Изменить пароль',sessions:'Активные устройства',loading:'Загрузка…',savedProfile:'Профиль сохранён.',savedSettings:'Настройки сохранены.',changed:'Пароль изменён. Остальные сессии завершены.',sessionEnded:'Сессия завершена',requestError:'Ошибка запроса',noSessions:'Активные сессии не найдены.',device:'Устройство',currentSession:'Текущая сессия',noIp:'IP не указан',revoke:'Завершить',revoked:'Сессия завершена.'},en:{title:'Lk_uni — profile',logout:'Sign out',home:'Home',profile:'Profile',organization:'Organization',members:'Members',eyebrow:'Account',pageTitle:'My profile',lead:'Personal details, preferences and account security.',basic:'Basic information',display:'Display name',phone:'Phone',saveProfile:'Save profile',settings:'Settings',language:'Interface language',timezone:'Time zone',saveSettings:'Save settings',password:'Change password',current:'Current password',next:'New password',change:'Change password',sessions:'Active devices',loading:'Loading…',savedProfile:'Profile saved.',savedSettings:'Settings saved.',changed:'Password changed. Other sessions were ended.',sessionEnded:'Session ended',requestError:'Request failed',noSessions:'No active sessions found.',device:'Device',currentSession:'Current session',noIp:'IP not available',revoke:'End session',revoked:'Session ended.'}};
function tr(){return T[LkUniI18n.current()]||T.ru}function render(){const t=tr();document.title=t.title;logout.textContent=t.logout;navHome.textContent=t.home;navProfile.textContent=t.profile;navOrganization.textContent=t.organization;navMembers.textContent=t.members;eyebrow.textContent=t.eyebrow;pageTitle.textContent=t.pageTitle;lead.textContent=t.lead;basicTitle.textContent=t.basic;displayNameLabel.textContent=t.display;phoneLabel.textContent=t.phone;saveProfile.textContent=t.saveProfile;settingsTitle.textContent=t.settings;languageLabel.textContent=t.language;timezoneLabel.textContent=t.timezone;saveSettings.textContent=t.saveSettings;passwordTitle.textContent=t.password;currentPasswordLabel.textContent=t.current;newPasswordLabel.textContent=t.next;changePasswordButton.textContent=t.change;sessionsTitle.textContent=t.sessions;LkUniI18n.bindButton(langButton)}
function storage(){if(localStorage.getItem('lkuni.accessToken'))return localStorage;if(sessionStorage.getItem('lkuni.accessToken'))return sessionStorage;return null}const s=storage();if(!s)location.href='/login/';function token(){return s?.getItem('lkuni.accessToken')||''}function headers(){return {'content-type':'application/json','authorization':'Bearer '+token()}}function notice(text,error=false){const n=document.getElementById('notice');n.textContent=text;n.className='notice '+(error?'error':'ok')}async function api(url,options={}){const r=await fetch(url,{...options,headers:{...headers(),...(options.headers||{})}});const data=await r.json().catch(()=>({}));if(r.status===401){location.href='/login/';throw new Error(tr().sessionEnded)}if(!r.ok)throw new Error(data.error||data.message||tr().requestError);return data}
async function load(){try{const p=await api('/api/v1/profile');const u=p.user||p.profile||p;displayName.value=u.displayName||u.display_name||'';phone.value=u.phone||'';email.value=u.email||'';const st=await api('/api/v1/profile/settings');const v=st.settings||st;if(v.language&&v.language!==LkUniI18n.current())LkUniI18n.set(v.language);language.value=v.language||'ru';timezone.value=v.timezone||'Europe/Moscow';render();await loadSessions()}catch(e){notice(e.message,true)}}
profileForm.addEventListener('submit',async e=>{e.preventDefault();try{await api('/api/v1/profile',{method:'PATCH',body:JSON.stringify({displayName:displayName.value.trim(),phone:phone.value.trim()||null})});notice(tr().savedProfile)}catch(x){notice(x.message,true)}});settingsForm.addEventListener('submit',async e=>{e.preventDefault();try{const lang=language.value;await api('/api/v1/profile/settings',{method:'PATCH',body:JSON.stringify({language:lang,timezone:timezone.value.trim()})});LkUniI18n.set(lang);render();notice(tr().savedSettings)}catch(x){notice(x.message,true)}});passwordForm.addEventListener('submit',async e=>{e.preventDefault();try{await api('/api/v1/profile/change-password',{method:'POST',body:JSON.stringify({currentPassword:currentPassword.value,newPassword:newPassword.value})});passwordForm.reset();notice(tr().changed);await loadSessions()}catch(x){notice(x.message,true)}});
async function loadSessions(){const data=await api('/api/v1/profile/sessions');const items=data.sessions||[];const box=document.getElementById('sessions'),t=tr();if(!items.length){box.innerHTML='<p class="muted">'+t.noSessions+'</p>';return}box.innerHTML=items.map(x=>`<div class="session"><div><strong>${escapeHtml(x.deviceName||x.device_name||t.device)}</strong><div class="muted">${x.current?t.currentSession+' · ':''}${escapeHtml(x.ipAddress||x.ip_address||t.noIp)}</div></div>${x.current?'':'<button class="btn danger" data-session="'+x.id+'">'+t.revoke+'</button>'}</div>`).join('');box.querySelectorAll('[data-session]').forEach(b=>b.onclick=async()=>{try{await api('/api/v1/profile/sessions/'+encodeURIComponent(b.dataset.session),{method:'DELETE'});notice(tr().revoked);await loadSessions()}catch(x){notice(x.message,true)}})}function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
document.addEventListener('lkuni:language',()=>{render();language.value=LkUniI18n.current();loadSessions()});logout.onclick=async()=>{const rt=s?.getItem('lkuni.refreshToken');try{if(rt)await fetch('/api/v1/auth/logout',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({refreshToken:rt})})}finally{['lkuni.accessToken','lkuni.refreshToken','lkuni.user','lkuni.workspace'].forEach(k=>{localStorage.removeItem(k);sessionStorage.removeItem(k)});location.href='/login/'}};render();load();
</script></body></html>
