<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lk_uni — профиль</title>
<style>
:root{font-family:Inter,Arial,sans-serif;color:#172033;background:#f4f7fb}*{box-sizing:border-box}body{margin:0;background:#f4f7fb}button,input,select{font:inherit}.top{height:68px;background:#fff;border-bottom:1px solid #e6ebf2;display:flex;align-items:center;justify-content:space-between;padding:0 28px}.brand{font-size:22px;font-weight:800}.layout{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 68px)}.side{background:#fff;border-right:1px solid #e6ebf2;padding:24px 18px}.nav{display:grid;gap:8px}.nav a{padding:12px 14px;border-radius:12px;color:#465166;text-decoration:none;font-weight:700}.nav a.active,.nav a:hover{background:#eef4ff;color:#2458d3}.main{padding:34px;max-width:1050px}.eyebrow{color:#2458d3;font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}h1{font-size:38px;margin:10px 0 8px}.lead{color:#667085;margin:0 0 28px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:22px;margin-bottom:18px}.card h2{margin:0 0 18px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.field{display:grid;gap:7px}.field label{font-weight:700}.field input,.field select{padding:12px 13px;border:1px solid #ccd5e2;border-radius:12px;background:#fff}.field input:focus,.field select:focus{outline:none;border-color:#2458d3;box-shadow:0 0 0 4px rgba(36,88,211,.1)}.readonly{background:#f7f8fa!important;color:#667085}.actions{display:flex;gap:10px;margin-top:18px}.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:800;cursor:pointer}.primary{background:#2458d3;color:#fff}.secondary{background:#edf1f7;color:#26334b}.danger{background:#fff0ef;color:#b42318}.notice{padding:12px 14px;border-radius:12px;margin-bottom:18px}.ok{background:#ecfdf3;color:#027a48}.error{background:#fff0ef;color:#b42318}.hidden{display:none}.session{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:14px 0;border-top:1px solid #edf0f5}.session:first-of-type{border-top:0}.muted{color:#667085;font-size:14px}@media(max-width:800px){.layout{grid-template-columns:1fr}.side{display:none}.main{padding:24px}.grid{grid-template-columns:1fr}.top{padding:0 18px}}
</style>
</head><body>
<header class="top"><div class="brand">Lk_uni</div><button id="logout" class="btn secondary">Выйти</button></header>
<div class="layout"><aside class="side"><nav class="nav"><a href="/workspace/">Главная</a><a class="active" href="/profile/">Профиль</a><a href="#">Организация</a><a href="#">Участники</a></nav></aside>
<main class="main"><div class="eyebrow">Личный кабинет</div><h1>Мой профиль</h1><p class="lead">Основные данные, настройки и безопасность учётной записи.</p><div id="notice" class="notice hidden"></div>
<section class="card"><h2>Основные данные</h2><form id="profileForm"><div class="grid"><div class="field"><label for="displayName">Отображаемое имя</label><input id="displayName" required maxlength="120"></div><div class="field"><label for="phone">Телефон</label><input id="phone" autocomplete="tel" placeholder="+7 900 000-00-00"></div><div class="field"><label for="email">Email</label><input id="email" class="readonly" readonly></div></div><div class="actions"><button class="btn primary" type="submit">Сохранить профиль</button></div></form></section>
<section class="card"><h2>Настройки</h2><form id="settingsForm"><div class="grid"><div class="field"><label for="language">Язык интерфейса</label><select id="language"><option value="ru">Русский</option><option value="en">English</option></select></div><div class="field"><label for="timezone">Часовой пояс</label><input id="timezone" value="Europe/Moscow" placeholder="Europe/Moscow"></div></div><div class="actions"><button class="btn primary" type="submit">Сохранить настройки</button></div></form></section>
<section class="card"><h2>Смена пароля</h2><form id="passwordForm"><div class="grid"><div class="field"><label for="currentPassword">Текущий пароль</label><input id="currentPassword" type="password" autocomplete="current-password" required></div><div class="field"><label for="newPassword">Новый пароль</label><input id="newPassword" type="password" autocomplete="new-password" minlength="8" required></div></div><div class="actions"><button class="btn primary" type="submit">Изменить пароль</button></div></form></section>
<section class="card"><h2>Активные устройства</h2><div id="sessions"><p class="muted">Загрузка…</p></div></section></main></div>
<script>
function storage(){if(localStorage.getItem('lkuni.accessToken'))return localStorage;if(sessionStorage.getItem('lkuni.accessToken'))return sessionStorage;return null}const s=storage();if(!s)location.href='/login/';
function token(){return s?.getItem('lkuni.accessToken')||''}function headers(){return {'content-type':'application/json','authorization':'Bearer '+token()}}function notice(text,error=false){const n=document.getElementById('notice');n.textContent=text;n.className='notice '+(error?'error':'ok');n.scrollIntoView({behavior:'smooth',block:'nearest'})}
async function api(url,options={}){const r=await fetch(url,{...options,headers:{...headers(),...(options.headers||{})}});const data=await r.json().catch(()=>({}));if(r.status===401){location.href='/login/';throw new Error('Сессия завершена')}if(!r.ok)throw new Error(data.error||data.message||'Ошибка запроса');return data}
async function load(){try{const p=await api('/api/v1/profile');const u=p.user||p.profile||p;displayName.value=u.displayName||u.display_name||'';phone.value=u.phone||'';email.value=u.email||'';const st=await api('/api/v1/profile/settings');const v=st.settings||st;language.value=v.language||'ru';timezone.value=v.timezone||'Europe/Moscow';await loadSessions()}catch(e){notice(e.message,true)}}
profileForm.addEventListener('submit',async e=>{e.preventDefault();try{await api('/api/v1/profile',{method:'PATCH',body:JSON.stringify({displayName:displayName.value.trim(),phone:phone.value.trim()||null})});notice('Профиль сохранён.')}catch(x){notice(x.message,true)}});
settingsForm.addEventListener('submit',async e=>{e.preventDefault();try{await api('/api/v1/profile/settings',{method:'PATCH',body:JSON.stringify({language:language.value,timezone:timezone.value.trim()})});notice('Настройки сохранены.')}catch(x){notice(x.message,true)}});
passwordForm.addEventListener('submit',async e=>{e.preventDefault();try{const data=await api('/api/v1/profile/change-password',{method:'POST',body:JSON.stringify({currentPassword:currentPassword.value,newPassword:newPassword.value})});if(data.tokens){s.setItem('lkuni.accessToken',data.tokens.accessToken||'');s.setItem('lkuni.refreshToken',data.tokens.refreshToken||'')}passwordForm.reset();notice('Пароль изменён. Остальные сессии завершены.');await loadSessions()}catch(x){notice(x.message,true)}});
async function loadSessions(){const data=await api('/api/v1/profile/sessions');const items=data.sessions||[];const box=document.getElementById('sessions');if(!items.length){box.innerHTML='<p class="muted">Активные сессии не найдены.</p>';return}box.innerHTML=items.map(x=>`<div class="session"><div><strong>${escapeHtml(x.deviceName||x.device_name||'Устройство')}</strong><div class="muted">${x.current?'Текущая сессия · ':''}${escapeHtml(x.ipAddress||x.ip_address||'IP не указан')}</div></div>${x.current?'':'<button class="btn danger" data-session="'+x.id+'">Завершить</button>'}</div>`).join('');box.querySelectorAll('[data-session]').forEach(b=>b.onclick=async()=>{try{await api('/api/v1/profile/sessions/'+encodeURIComponent(b.dataset.session),{method:'DELETE'});notice('Сессия завершена.');await loadSessions()}catch(x){notice(x.message,true)}})}
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
document.getElementById('logout').onclick=async()=>{const rt=s?.getItem('lkuni.refreshToken');try{if(rt)await fetch('/api/v1/auth/logout',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({refreshToken:rt})})}finally{['lkuni.accessToken','lkuni.refreshToken','lkuni.user','lkuni.workspace'].forEach(k=>{localStorage.removeItem(k);sessionStorage.removeItem(k)});location.href='/login/'}};load();
</script></body></html>
