<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lk_uni</title><style>:root{font-family:Inter,Arial,sans-serif;color:#172033;background:#f4f7fb}*{box-sizing:border-box}body{margin:0;background:#f4f7fb}button,input,textarea,select{font:inherit}.top{height:68px;background:#fff;border-bottom:1px solid #e6ebf2;display:flex;align-items:center;justify-content:space-between;padding:0 28px}.brand{font-size:22px;font-weight:800}.top-actions{display:flex;align-items:center;gap:10px}.layout{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 68px)}.side{background:#fff;border-right:1px solid #e6ebf2;padding:24px 18px}.nav{display:grid;gap:8px}.nav a{padding:12px 14px;border-radius:12px;color:#465166;text-decoration:none;font-weight:700}.nav a.active,.nav a:hover{background:#eef4ff;color:#2458d3}.main{padding:34px;max-width:1050px}.eyebrow{color:#2458d3;font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}h1{font-size:38px;margin:10px 0 8px}.lead{color:#667085;margin:0 0 28px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:22px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.field{display:grid;gap:7px}.field.full{grid-column:1/-1}.field label{font-weight:700}.field input,.field textarea,.field select{padding:12px 13px;border:1px solid #ccd5e2;border-radius:12px;background:#fff}.field textarea{min-height:110px;resize:vertical}.actions{display:flex;gap:10px;margin-top:18px}.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:800;cursor:pointer}.primary{background:#2458d3;color:#fff}.secondary{background:#edf1f7;color:#26334b}.lang{background:#fff;border:1px solid #dce3ee}.notice{padding:12px 14px;border-radius:12px;margin-bottom:18px}.ok{background:#ecfdf3;color:#027a48}.error{background:#fff0ef;color:#b42318}.hidden{display:none}.role{color:#667085;font-size:14px}@media(max-width:800px){.layout{grid-template-columns:1fr}.side{display:none}.main{padding:24px}.grid{grid-template-columns:1fr}.field.full{grid-column:auto}.top{padding:0 18px}}</style></head><body>
<header class="top"><div class="brand">Lk_uni</div><div class="top-actions"><span id="role" class="role"></span><button id="langButton" class="btn lang"></button><button id="logout" class="btn secondary"></button></div></header><div class="layout"><aside class="side"><nav class="nav"><a id="navHome" href="/workspace/"></a><a id="navProfile" href="/profile/"></a><a id="navOrganization" class="active" href="/organization/"></a><a id="navMembers" href="#"></a></nav></aside><main class="main"><div id="eyebrow" class="eyebrow"></div><h1 id="pageTitle"></h1><p id="lead" class="lead"></p><div id="notice" class="notice hidden"></div><section class="card"><form id="form"><div class="grid"><div class="field"><label id="nameLabel" for="name"></label><input id="name" required maxlength="255"></div><div class="field"><label id="websiteLabel" for="website"></label><input id="website" type="url" placeholder="https://example.ru"></div><div class="field"><label id="emailLabel" for="email"></label><input id="email" type="email"></div><div class="field"><label id="phoneLabel" for="phone"></label><input id="phone" autocomplete="tel"></div><div class="field full"><label id="descriptionLabel" for="description"></label><textarea id="description"></textarea></div><div class="field full"><label id="addressLabel" for="address"></label><input id="address"></div><div class="field"><label id="languageLabel" for="language"></label><select id="language"><option value="ru">Русский</option><option value="en">English</option></select></div><div class="field"><label id="timezoneLabel" for="timezone"></label><input id="timezone" value="Europe/Moscow"></div></div><div class="actions"><button id="save" class="btn primary" type="submit"></button></div></form></section></main></div>
<script src="/shared/i18n.js"></script><script>
const T={ru:{title:'Lk_uni — организация',logout:'Выйти',home:'Главная',profile:'Профиль',organization:'Организация',members:'Участники',eyebrow:'Рабочее пространство',pageTitle:'Организация',lead:'Основные сведения и настройки организации текущего проекта.',name:'Название *',website:'Сайт',email:'Контактный email',phone:'Телефон',description:'Описание',address:'Адрес',language:'Язык по умолчанию',timezone:'Часовой пояс',save:'Сохранить',saving:'Сохраняем…',saved:'Данные организации сохранены.',role:'Роль',readonly:'У вас есть доступ только для просмотра.',sessionEnded:'Сессия завершена',requestError:'Ошибка запроса'},en:{title:'Lk_uni — organization',logout:'Sign out',home:'Home',profile:'Profile',organization:'Organization',members:'Members',eyebrow:'Workspace',pageTitle:'Organization',lead:'Core details and settings for the current project organization.',name:'Name *',website:'Website',email:'Contact email',phone:'Phone',description:'Description',address:'Address',language:'Default language',timezone:'Time zone',save:'Save',saving:'Saving…',saved:'Organization details saved.',role:'Role',readonly:'You have read-only access.',sessionEnded:'Session ended',requestError:'Request failed'}};
function tr(){return T[LkUniI18n.current()]||T.ru}function render(){const t=tr();document.title=t.title;logout.textContent=t.logout;navHome.textContent=t.home;navProfile.textContent=t.profile;navOrganization.textContent=t.organization;navMembers.textContent=t.members;eyebrow.textContent=t.eyebrow;pageTitle.textContent=t.pageTitle;lead.textContent=t.lead;nameLabel.textContent=t.name;websiteLabel.textContent=t.website;emailLabel.textContent=t.email;phoneLabel.textContent=t.phone;descriptionLabel.textContent=t.description;addressLabel.textContent=t.address;languageLabel.textContent=t.language;timezoneLabel.textContent=t.timezone;save.textContent=t.save;LkUniI18n.bindButton(langButton)}function storage(){if(localStorage.getItem('lkuni.accessToken'))return localStorage;if(sessionStorage.getItem('lkuni.accessToken'))return sessionStorage;return null}const s=storage();if(!s)location.href='/login/';function token(){return s?.getItem('lkuni.accessToken')||''}function headers(){return {'content-type':'application/json','authorization':'Bearer '+token()}}function show(text,error=false){const n=document.getElementById('notice');n.textContent=text;n.className='notice '+(error?'error':'ok')}async function api(url,options={}){const r=await fetch(url,{...options,headers:{...headers(),...(options.headers||{})}});const data=await r.json().catch(()=>({}));if(r.status===401){location.href='/login/';throw new Error(tr().sessionEnded)}if(!r.ok)throw new Error(data.error||data.message||tr().requestError);return data}async function syncProfileLanguage(){try{const data=await api('/api/v1/profile/settings');const lang=(data.settings||data).language;if(lang&&lang!==LkUniI18n.current())LkUniI18n.set(lang)}catch{}}
async function load(){try{await syncProfileLanguage();render();const data=await api('/api/v1/organization');const o=data.organization||data;name.value=o.name||'';website.value=o.website||'';email.value=o.email||'';phone.value=o.phone||'';description.value=o.description||'';address.value=o.address||'';language.value=o.language||'ru';timezone.value=o.timezone||'Europe/Moscow';role.textContent=o.role?(tr().role+': '+o.role):'';if(!['OWNER','ADMIN'].includes(o.role)){[...form.elements].forEach(x=>x.disabled=true);show(tr().readonly)}}catch(e){show(e.message,true)}}form.addEventListener('submit',async e=>{e.preventDefault();save.disabled=true;save.textContent=tr().saving;try{await api('/api/v1/organization',{method:'PATCH',body:JSON.stringify({name:name.value.trim(),website:website.value.trim(),email:email.value.trim(),phone:phone.value.trim(),description:description.value.trim(),address:address.value.trim(),language:language.value,timezone:timezone.value.trim()})});show(tr().saved)}catch(x){show(x.message,true)}finally{save.disabled=false;save.textContent=tr().save}});document.addEventListener('lkuni:language',render);logout.onclick=async()=>{const rt=s?.getItem('lkuni.refreshToken');try{if(rt)await fetch('/api/v1/auth/logout',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({refreshToken:rt})})}finally{['lkuni.accessToken','lkuni.refreshToken','lkuni.user','lkuni.workspace'].forEach(k=>{localStorage.removeItem(k);sessionStorage.removeItem(k)});location.href='/login/'}};render();load();
</script></body></html>
