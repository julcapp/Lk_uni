<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lk_uni — организация</title>
<style>
:root{font-family:Inter,Arial,sans-serif;color:#172033;background:#f4f7fb}*{box-sizing:border-box}body{margin:0;background:#f4f7fb}button,input,textarea,select{font:inherit}.top{height:68px;background:#fff;border-bottom:1px solid #e6ebf2;display:flex;align-items:center;justify-content:space-between;padding:0 28px}.brand{font-size:22px;font-weight:800}.layout{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 68px)}.side{background:#fff;border-right:1px solid #e6ebf2;padding:24px 18px}.nav{display:grid;gap:8px}.nav a{padding:12px 14px;border-radius:12px;color:#465166;text-decoration:none;font-weight:700}.nav a.active,.nav a:hover{background:#eef4ff;color:#2458d3}.main{padding:34px;max-width:1050px}.eyebrow{color:#2458d3;font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}h1{font-size:38px;margin:10px 0 8px}.lead{color:#667085;margin:0 0 28px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:22px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.field{display:grid;gap:7px}.field.full{grid-column:1/-1}.field label{font-weight:700}.field input,.field textarea,.field select{padding:12px 13px;border:1px solid #ccd5e2;border-radius:12px;background:#fff}.field textarea{min-height:110px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:#2458d3;box-shadow:0 0 0 4px rgba(36,88,211,.1)}.actions{display:flex;gap:10px;margin-top:18px}.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:800;cursor:pointer}.primary{background:#2458d3;color:#fff}.secondary{background:#edf1f7;color:#26334b}.notice{padding:12px 14px;border-radius:12px;margin-bottom:18px}.ok{background:#ecfdf3;color:#027a48}.error{background:#fff0ef;color:#b42318}.hidden{display:none}.role{margin-left:auto;color:#667085;font-size:14px}@media(max-width:800px){.layout{grid-template-columns:1fr}.side{display:none}.main{padding:24px}.grid{grid-template-columns:1fr}.field.full{grid-column:auto}.top{padding:0 18px}}
</style>
</head><body>
<header class="top"><div class="brand">Lk_uni</div><div style="display:flex;align-items:center;gap:12px"><span id="role" class="role"></span><button id="logout" class="btn secondary">Выйти</button></div></header>
<div class="layout"><aside class="side"><nav class="nav"><a href="/workspace/">Главная</a><a href="/profile/">Профиль</a><a class="active" href="/organization/">Организация</a><a href="#">Участники</a></nav></aside>
<main class="main"><div class="eyebrow">Рабочее пространство</div><h1>Организация</h1><p class="lead">Основные сведения и настройки организации текущего проекта.</p><div id="notice" class="notice hidden"></div>
<section class="card"><form id="form"><div class="grid"><div class="field"><label for="name">Название *</label><input id="name" required maxlength="255"></div><div class="field"><label for="website">Сайт</label><input id="website" type="url" placeholder="https://example.ru"></div><div class="field"><label for="email">Контактный email</label><input id="email" type="email"></div><div class="field"><label for="phone">Телефон</label><input id="phone" autocomplete="tel"></div><div class="field full"><label for="description">Описание</label><textarea id="description"></textarea></div><div class="field full"><label for="address">Адрес</label><input id="address"></div><div class="field"><label for="language">Язык по умолчанию</label><select id="language"><option value="ru">Русский</option><option value="en">English</option></select></div><div class="field"><label for="timezone">Часовой пояс</label><input id="timezone" value="Europe/Moscow"></div></div><div class="actions"><button id="save" class="btn primary" type="submit">Сохранить</button></div></form></section></main></div>
<script>
function storage(){if(localStorage.getItem('lkuni.accessToken'))return localStorage;if(sessionStorage.getItem('lkuni.accessToken'))return sessionStorage;return null}const s=storage();if(!s)location.href='/login/';function token(){return s?.getItem('lkuni.accessToken')||''}function headers(){return {'content-type':'application/json','authorization':'Bearer '+token()}}function show(text,error=false){const n=document.getElementById('notice');n.textContent=text;n.className='notice '+(error?'error':'ok');n.scrollIntoView({behavior:'smooth',block:'nearest'})}async function api(url,options={}){const r=await fetch(url,{...options,headers:{...headers(),...(options.headers||{})}});const data=await r.json().catch(()=>({}));if(r.status===401){location.href='/login/';throw new Error('Сессия завершена')}if(!r.ok)throw new Error(data.error||data.message||'Ошибка запроса');return data}async function load(){try{const data=await api('/api/v1/organization');const o=data.organization||data;name.value=o.name||'';website.value=o.website||'';email.value=o.email||'';phone.value=o.phone||'';description.value=o.description||'';address.value=o.address||'';language.value=o.language||'ru';timezone.value=o.timezone||'Europe/Moscow';role.textContent=o.role?('Роль: '+o.role):'';if(!['OWNER','ADMIN'].includes(o.role)){[...form.elements].forEach(x=>x.disabled=true);show('У вас есть доступ только для просмотра.')}}catch(e){show(e.message,true)}}form.addEventListener('submit',async e=>{e.preventDefault();save.disabled=true;save.textContent='Сохраняем…';try{await api('/api/v1/organization',{method:'PATCH',body:JSON.stringify({name:name.value.trim(),website:website.value.trim(),email:email.value.trim(),phone:phone.value.trim(),description:description.value.trim(),address:address.value.trim(),language:language.value,timezone:timezone.value.trim()})});show('Данные организации сохранены.')}catch(x){show(x.message,true)}finally{save.disabled=false;save.textContent='Сохранить'}});document.getElementById('logout').onclick=async()=>{const rt=s?.getItem('lkuni.refreshToken');try{if(rt)await fetch('/api/v1/auth/logout',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({refreshToken:rt})})}finally{['lkuni.accessToken','lkuni.refreshToken','lkuni.user','lkuni.workspace'].forEach(k=>{localStorage.removeItem(k);sessionStorage.removeItem(k)});location.href='/login/'}};load();
</script></body></html>
