<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lk_uni</title><style>:root{font-family:Inter,Arial,sans-serif;color:#172033;background:#f4f7fb}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#eef4ff,#f8fbff 48%,#f7f5ff)}button,input{font:inherit}.shell{min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(460px,100%);background:#fff;border:1px solid #e5eaf2;border-radius:26px;box-shadow:0 30px 80px rgba(35,54,95,.13);padding:34px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:30px}.brand{font-weight:800;font-size:22px}.lang{border:1px solid #dce3ee;background:#fff;border-radius:12px;padding:9px 12px}.eyebrow{color:#2458d3;font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.08em}h1{font-size:34px;margin:10px 0 12px}.lead{color:#667085;margin:0 0 26px}.field{display:grid;gap:8px;margin-bottom:18px}.field label{font-weight:700}.field input{padding:14px 15px;border:1px solid #ccd5e2;border-radius:13px;outline:none}.field input:focus{border-color:#2458d3;box-shadow:0 0 0 4px rgba(36,88,211,.1)}.btn{width:100%;border:0;border-radius:14px;padding:14px 20px;background:#2458d3;color:#fff;font-weight:800;cursor:pointer}.btn:disabled{opacity:.65}.alert{padding:12px 14px;border-radius:12px;margin-bottom:18px;background:#fff0ef;color:#b42318}.success{padding:14px;border-radius:14px;background:#eefaf2;color:#177245;margin:18px 0}.hidden{display:none}.footer{margin-top:22px;text-align:center}.link{color:#2458d3;text-decoration:none;font-weight:700}@media(max-width:520px){.card{padding:26px 22px}h1{font-size:30px}}</style></head><body><div class="shell"><main class="card"><div class="top"><div class="brand">Lk_uni</div><button class="lang" id="lang" type="button"></button></div><div id="checking"><div class="eyebrow" id="checkingEyebrow"></div><h1 id="checkingTitle"></h1><p class="lead" id="checkingLead"></p></div><section id="formPanel" class="hidden"><div class="eyebrow" id="formEyebrow"></div><h1 id="formTitle"></h1><p class="lead" id="formLead"></p><div id="alert" class="alert hidden" role="alert"></div><form id="form"><div class="field"><label for="password" id="passwordLabel"></label><input id="password" type="password" autocomplete="new-password" minlength="8" required></div><div class="field"><label for="confirm" id="confirmLabel"></label><input id="confirm" type="password" autocomplete="new-password" minlength="8" required></div><button id="submit" class="btn" type="submit"></button></form></section><section id="invalidPanel" class="hidden"><div class="eyebrow" id="invalidEyebrow"></div><h1 id="invalidTitle"></h1><div class="alert" id="invalidText"></div></section><section id="donePanel" class="hidden"><div class="eyebrow" id="doneEyebrow"></div><h1 id="doneTitle"></h1><div class="success" id="doneText"></div><button class="btn" id="workspaceButton" onclick="location.href='/workspace/'"></button></section><div class="footer"><a class="link" id="newLink" href="/forgot-password/"></a></div></main></div><script src="/shared/i18n.js"></script><script>const copy={ru:{title:'Lk_uni — новый пароль',checkingEyebrow:'Проверяем ссылку',checkingTitle:'Подождите…',checkingLead:'Проверяем возможность установить новый пароль.',formEyebrow:'Новый пароль',formTitle:'Установите новый пароль',formLead:'Пароль должен содержать не менее 8 символов.',password:'Новый пароль',confirm:'Повторите пароль',submit:'Сохранить новый пароль',working:'Сохраняем…',mismatch:'Пароли не совпадают.',short:'Пароль должен содержать не менее 8 символов.',failed:'Не удалось изменить пароль.',invalidEyebrow:'Ссылка недействительна',invalidTitle:'Запросите новую ссылку',invalidText:'Ссылка восстановления недействительна, уже использована или срок её действия истёк.',doneEyebrow:'Пароль изменён',doneTitle:'Доступ восстановлен',doneText:'Новый пароль сохранён. Вы вошли в рабочее пространство автоматически.',workspace:'Перейти в рабочее пространство',newLink:'Запросить новую ссылку'},en:{title:'Lk_uni — new password',checkingEyebrow:'Checking link',checkingTitle:'Please wait…',checkingLead:'Checking whether a new password can be set.',formEyebrow:'New password',formTitle:'Set a new password',formLead:'The password must contain at least 8 characters.',password:'New password',confirm:'Repeat password',submit:'Save new password',working:'Saving…',mismatch:'Passwords do not match.',short:'The password must contain at least 8 characters.',failed:'Unable to change the password.',invalidEyebrow:'Invalid link',invalidTitle:'Request a new link',invalidText:'The recovery link is invalid, has already been used, or has expired.',doneEyebrow:'Password changed',doneTitle:'Access restored',doneText:'Your new password has been saved. You are signed in automatically.',workspace:'Open workspace',newLink:'Request a new link'}};function c(){return copy[LkUniI18n.current()]||copy.ru}function render(){const t=c();document.title=t.title;checkingEyebrow.textContent=t.checkingEyebrow;checkingTitle.textContent=t.checkingTitle;checkingLead.textContent=t.checkingLead;formEyebrow.textContent=t.formEyebrow;formTitle.textContent=t.formTitle;formLead.textContent=t.formLead;passwordLabel.textContent=t.password;confirmLabel.textContent=t.confirm;submit.textContent=t.submit;invalidEyebrow.textContent=t.invalidEyebrow;invalidTitle.textContent=t.invalidTitle;invalidText.textContent=t.invalidText;doneEyebrow.textContent=t.doneEyebrow;doneTitle.textContent=t.doneTitle;doneText.textContent=t.doneText;workspaceButton.textContent=t.workspace;newLink.textContent=t.newLink}LkUniI18n.bindButton(lang);document.addEventListener('lkuni:language',render);render();const token=new URLSearchParams(location.search).get('token')||'';async function validate(){if(!token){checking.classList.add('hidden');invalidPanel.classList.remove('hidden');return}try{const r=await fetch('/api/v1/auth/password-reset/validate?token='+encodeURIComponent(token));const data=await r.json().catch(()=>({valid:false}));checking.classList.add('hidden');(data.valid?formPanel:invalidPanel).classList.remove('hidden')}catch{checking.classList.add('hidden');invalidPanel.classList.remove('hidden')}}function store(data){localStorage.setItem('lkuni.accessToken',data.tokens?.accessToken||'');localStorage.setItem('lkuni.refreshToken',data.tokens?.refreshToken||'');localStorage.setItem('lkuni.user',JSON.stringify(data.user||{}));localStorage.setItem('lkuni.workspace',JSON.stringify(data.workspace||{}));['lkuni.accessToken','lkuni.refreshToken','lkuni.user','lkuni.workspace'].forEach(k=>sessionStorage.removeItem(k))}form.addEventListener('submit',async(e)=>{e.preventDefault();alert.classList.add('hidden');const pass=password.value,repeat=confirm.value;if(pass.length<8||pass!==repeat){alert.textContent=pass!==repeat?c().mismatch:c().short;alert.classList.remove('hidden');return}submit.disabled=true;submit.textContent=c().working;try{const r=await fetch('/api/v1/auth/password-reset/confirm',{method:'POST',headers:{'content-type':'application/json','x-device-name':'Lk_uni Web'},body:JSON.stringify({token,password:pass})});const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.error||c().failed);store(data);formPanel.classList.add('hidden');donePanel.classList.remove('hidden')}catch(err){alert.textContent=err.message;alert.classList.remove('hidden')}finally{submit.disabled=false;submit.textContent=c().submit}});validate();</script></body></html>
