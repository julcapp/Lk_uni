<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Lk_uni — вход</title>
  <style>
    :root{font-family:Inter,Arial,sans-serif;color:#172033;background:#f4f7fb}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#eef4ff,#f8fbff 48%,#f7f5ff)}button,input{font:inherit}.shell{min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(460px,100%);background:#fff;border:1px solid #e5eaf2;border-radius:26px;box-shadow:0 30px 80px rgba(35,54,95,.13);padding:34px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:34px}.brand{font-weight:800;font-size:22px}.lang{border:1px solid #dce3ee;background:#fff;border-radius:12px;padding:9px 12px}.eyebrow{color:#2458d3;font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.08em}h1{font-size:34px;line-height:1.1;margin:10px 0 12px}.lead{color:#667085;margin:0 0 28px}.field{display:grid;gap:8px;margin-bottom:18px}.field label{font-weight:700}.field input{width:100%;padding:14px 15px;border:1px solid #ccd5e2;border-radius:13px;outline:none}.field input:focus{border-color:#2458d3;box-shadow:0 0 0 4px rgba(36,88,211,.1)}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:4px 0 22px}.remember{display:flex;align-items:center;gap:8px;color:#465166}.link{color:#2458d3;text-decoration:none;font-weight:700}.btn{width:100%;border:0;border-radius:14px;padding:14px 20px;background:#2458d3;color:#fff;font-weight:800;cursor:pointer}.btn:disabled{opacity:.65;cursor:wait}.alert{padding:12px 14px;border-radius:12px;margin-bottom:18px;background:#fff0ef;color:#b42318;font-size:14px}.hidden{display:none}.footer{margin-top:24px;padding-top:22px;border-top:1px solid #edf0f5;text-align:center;color:#667085}@media(max-width:520px){.card{padding:26px 22px;border-radius:20px}h1{font-size:30px}.row{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body>
<div class="shell">
  <main class="card">
    <div class="top"><div class="brand">Lk_uni</div><button class="lang" id="lang" type="button">RU · EN</button></div>
    <div class="eyebrow" id="eyebrow"></div>
    <h1 id="title"></h1>
    <p class="lead" id="lead"></p>
    <div id="alert" class="alert hidden" role="alert"></div>
    <form id="loginForm" novalidate>
      <div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="username" required placeholder="name@example.ru"></div>
      <div class="field"><label for="password" id="passwordLabel"></label><input id="password" type="password" autocomplete="current-password" minlength="8" required></div>
      <div class="row">
        <label class="remember"><input id="remember" type="checkbox" checked> <span id="rememberText"></span></label>
        <a class="link" id="forgotLink" href="/forgot-password/"></a>
      </div>
      <button id="submitButton" class="btn" type="submit"></button>
    </form>
    <div class="footer"><span id="noProject"></span> <a class="link" id="createLink" href="/create-project/"></a></div>
  </main>
</div>
<script src="/shared/i18n.js"></script>
<script>
const copy={ru:{title:'Lk_uni — вход',eyebrow:'Вход в рабочее пространство',heading:'Добро пожаловать',lead:'Введите email и пароль владельца проекта.',password:'Пароль',passwordPlaceholder:'Не менее 8 символов',remember:'Запомнить меня',forgot:'Забыли пароль?',submit:'Войти',working:'Входим…',noProject:'Нет проекта?',create:'Создать рабочее пространство',validation:'Введите корректный email и пароль не короче 8 символов.',invalid:'Неверный адрес электронной почты или пароль.',failed:'Не удалось выполнить вход. Попробуйте ещё раз.'},en:{title:'Lk_uni — sign in',eyebrow:'Workspace sign in',heading:'Welcome',lead:'Enter the project owner email and password.',password:'Password',passwordPlaceholder:'At least 8 characters',remember:'Remember me',forgot:'Forgot password?',submit:'Sign in',working:'Signing in…',noProject:'No project yet?',create:'Create workspace',validation:'Enter a valid email and a password of at least 8 characters.',invalid:'Incorrect email or password.',failed:'Unable to sign in. Please try again.'}};
const form=document.getElementById('loginForm'),alertBox=document.getElementById('alert'),button=document.getElementById('submitButton');
function c(){return copy[LkUniI18n.current()]||copy.ru}function render(){const t=c();document.title=t.title;eyebrow.textContent=t.eyebrow;title.textContent=t.heading;lead.textContent=t.lead;passwordLabel.textContent=t.password;password.placeholder=t.passwordPlaceholder;rememberText.textContent=t.remember;forgotLink.textContent=t.forgot;button.textContent=t.submit;noProject.textContent=t.noProject;createLink.textContent=t.create}LkUniI18n.bindButton(document.getElementById('lang'));document.addEventListener('lkuni:language',render);render();
function showError(message){alertBox.textContent=message;alertBox.classList.remove('hidden')}function clearStoredSession(){['lkuni.accessToken','lkuni.refreshToken','lkuni.user','lkuni.workspace'].forEach(key=>{localStorage.removeItem(key);sessionStorage.removeItem(key)})}function storeSession(data,remember){clearStoredSession();const storage=remember?localStorage:sessionStorage;storage.setItem('lkuni.accessToken',data.tokens?.accessToken||data.accessToken||'');storage.setItem('lkuni.refreshToken',data.tokens?.refreshToken||data.refreshToken||'');storage.setItem('lkuni.user',JSON.stringify(data.user||data.owner||{}));storage.setItem('lkuni.workspace',JSON.stringify(data.workspace||{}))}
form.addEventListener('submit',async(event)=>{event.preventDefault();alertBox.classList.add('hidden');const email=document.getElementById('email').value.trim();const pass=document.getElementById('password').value;if(!/^\S+@\S+\.\S+$/.test(email)||pass.length<8){showError(c().validation);return}button.disabled=true;button.textContent=c().working;try{const response=await fetch('/api/v1/auth/password-login',{method:'POST',headers:{'content-type':'application/json','x-device-name':'Lk_uni Web'},body:JSON.stringify({email,password:pass})});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||c().invalid);storeSession(data,document.getElementById('remember').checked);location.href='/workspace/'}catch(error){showError(error.message||c().failed)}finally{button.disabled=false;button.textContent=c().submit}});
</script>
</body>
</html>
