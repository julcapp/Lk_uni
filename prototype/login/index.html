<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Lk_uni — вход</title>
  <style>
    :root{font-family:Inter,Arial,sans-serif;color:#172033;background:#f4f7fb}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#eef4ff,#f8fbff 48%,#f7f5ff)}button,input{font:inherit}.shell{min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(460px,100%);background:#fff;border:1px solid #e5eaf2;border-radius:26px;box-shadow:0 30px 80px rgba(35,54,95,.13);padding:34px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:34px}.brand{font-weight:800;font-size:22px}.lang{border:1px solid #dce3ee;background:#fff;border-radius:12px;padding:9px 12px}.eyebrow{color:#2458d3;font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.08em}h1{font-size:34px;line-height:1.1;margin:10px 0 12px}.lead{color:#667085;margin:0 0 28px}.field{display:grid;gap:8px;margin-bottom:18px}.field label{font-weight:700}.field input{width:100%;padding:14px 15px;border:1px solid #ccd5e2;border-radius:13px;outline:none}.field input:focus{border-color:#2458d3;box-shadow:0 0 0 4px rgba(36,88,211,.1)}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:4px 0 22px}.remember{display:flex;align-items:center;gap:8px;color:#465166}.link{color:#2458d3;text-decoration:none;font-weight:700}.btn{width:100%;border:0;border-radius:14px;padding:14px 20px;background:#2458d3;color:#fff;font-weight:800;cursor:pointer}.btn:disabled{opacity:.65;cursor:wait}.alert{padding:12px 14px;border-radius:12px;margin-bottom:18px;background:#fff0ef;color:#b42318;font-size:14px}.hidden{display:none}.footer{margin-top:24px;padding-top:22px;border-top:1px solid #edf0f5;text-align:center;color:#667085}.workspace{margin-top:24px;padding:18px;border-radius:16px;background:#f4f7fb}.workspace h2{margin:0 0 8px;font-size:20px}.workspace p{margin:4px 0;color:#667085}@media(max-width:520px){.card{padding:26px 22px;border-radius:20px}h1{font-size:30px}.row{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body>
<div class="shell">
  <main class="card">
    <div class="top"><div class="brand">Lk_uni</div><button class="lang" type="button">RU · EN</button></div>
    <section id="loginPanel">
      <div class="eyebrow">Вход в рабочее пространство</div>
      <h1>Добро пожаловать</h1>
      <p class="lead">Введите email и пароль владельца проекта.</p>
      <div id="alert" class="alert hidden" role="alert"></div>
      <form id="loginForm" novalidate>
        <div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="username" required placeholder="name@example.ru"></div>
        <div class="field"><label for="password">Пароль</label><input id="password" type="password" autocomplete="current-password" minlength="8" required placeholder="Не менее 8 символов"></div>
        <div class="row">
          <label class="remember"><input id="remember" type="checkbox" checked> Запомнить меня</label>
          <a class="link" href="/forgot-password/">Забыли пароль?</a>
        </div>
        <button id="submitButton" class="btn" type="submit">Войти</button>
      </form>
      <div class="footer">Нет проекта? <a class="link" href="/create-project/">Создать рабочее пространство</a></div>
    </section>
    <section id="successPanel" class="hidden">
      <div class="eyebrow">Вход выполнен</div>
      <h1 id="welcomeTitle">Рабочее пространство открыто</h1>
      <div class="workspace"><h2 id="workspaceName"></h2><p id="ownerName"></p><p>Сессия создана и готова к работе.</p></div>
      <button class="btn" type="button" onclick="location.href='/create-project/'" style="margin-top:20px">Перейти к главной странице</button>
    </section>
  </main>
</div>
<script>
const form=document.getElementById('loginForm');
const alertBox=document.getElementById('alert');
const button=document.getElementById('submitButton');
function showError(message){alertBox.textContent=message;alertBox.classList.remove('hidden')}
function storeSession(data,remember){const storage=remember?localStorage:sessionStorage;storage.setItem('lkuni.accessToken',data.tokens?.accessToken||data.accessToken||'');storage.setItem('lkuni.refreshToken',data.tokens?.refreshToken||data.refreshToken||'');storage.setItem('lkuni.user',JSON.stringify(data.user||data.owner||{}));storage.setItem('lkuni.workspace',JSON.stringify(data.workspace||{}))}
form.addEventListener('submit',async(event)=>{event.preventDefault();alertBox.classList.add('hidden');const email=document.getElementById('email').value.trim();const password=document.getElementById('password').value;if(!/^\S+@\S+\.\S+$/.test(email)||password.length<8){showError('Введите корректный email и пароль не короче 8 символов.');return}button.disabled=true;button.textContent='Входим…';try{const response=await fetch('/api/v1/auth/password-login',{method:'POST',headers:{'content-type':'application/json','x-device-name':'Lk_uni Web'},body:JSON.stringify({email,password})});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||'Неверный адрес электронной почты или пароль.');storeSession(data,document.getElementById('remember').checked);document.getElementById('workspaceName').textContent=data.workspace?.name||'Ваш проект';document.getElementById('ownerName').textContent=data.user?.displayName||data.user?.display_name||'';document.getElementById('loginPanel').classList.add('hidden');document.getElementById('successPanel').classList.remove('hidden')}catch(error){showError(error.message||'Не удалось выполнить вход. Попробуйте ещё раз.')}finally{button.disabled=false;button.textContent='Войти'}});
</script>
</body>
</html>
