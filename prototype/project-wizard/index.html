<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lk_uni</title><style>:root{font-family:Inter,Arial,sans-serif;color:#172033;background:#f4f7fb}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#eef4ff,#f8fbff 48%,#f7f5ff)}button,input{font:inherit}.shell{min-height:100vh;display:grid;place-items:center;padding:24px}.app{width:min(1080px,100%);background:#fff;border:1px solid #e5eaf2;border-radius:28px;box-shadow:0 30px 80px rgba(35,54,95,.13);overflow:hidden}.top{display:flex;justify-content:space-between;align-items:center;padding:22px 30px;border-bottom:1px solid #edf0f5}.brand{font-weight:800;font-size:21px}.lang{border:1px solid #dce3ee;background:#fff;border-radius:12px;padding:9px 12px}.main{display:grid;grid-template-columns:240px 1fr;min-height:620px}.side{padding:30px 22px;background:#f8faff;border-right:1px solid #edf0f5}.step{display:flex;gap:12px;align-items:center;color:#7c8799;margin-bottom:22px}.step span{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:#e9eef7;font-weight:700}.step.active{color:#2458d3;font-weight:700}.step.active span,.step.done span{background:#2458d3;color:#fff}.content{padding:54px 64px}.eyebrow{color:#2458d3;font-weight:800;font-size:14px;text-transform:uppercase;letter-spacing:.08em}h1{font-size:42px;line-height:1.1;margin:12px 0 14px}.lead{font-size:18px;color:#667085;max-width:650px}.panel{margin-top:34px}.field{display:grid;gap:8px;margin-bottom:20px}.field label{font-weight:700}.field input{width:100%;padding:15px 16px;border:1px solid #ccd5e2;border-radius:14px;outline:none}.field input:focus{border-color:#2458d3;box-shadow:0 0 0 4px rgba(36,88,211,.1)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{padding:20px;border:1px solid #dfe5ef;border-radius:16px;background:#fff;text-align:left;cursor:pointer}.card:hover,.card.selected{border-color:#2458d3;background:#f1f5ff}.card b{display:block;margin-top:8px}.actions{display:flex;justify-content:space-between;gap:14px;margin-top:34px}.btn{border:0;border-radius:14px;padding:14px 22px;cursor:pointer;font-weight:800}.btn:disabled{opacity:.65;cursor:wait}.primary{background:#2458d3;color:#fff}.secondary{background:#edf1f7;color:#26334b}.hidden{display:none}.status{display:grid;gap:14px;margin-top:28px}.status div{padding:14px 16px;background:#f4f7fb;border-radius:12px}.success{font-size:72px}.error{color:#b42318;font-size:14px;margin-top:-12px;margin-bottom:16px}.api-error{padding:14px 16px;background:#fff2f0;border:1px solid #fecdca;border-radius:12px;color:#b42318;margin-top:18px}@media(max-width:800px){.main{grid-template-columns:1fr}.side{display:none}.content{padding:34px 24px}.grid{grid-template-columns:1fr}h1{font-size:34px}}</style></head><body><div class="shell"><div class="app"><header class="top"><div class="brand">Lk_uni</div><button class="lang" id="lang" type="button"></button></header><div class="main"><aside class="side" id="steps"></aside><main class="content"><section id="screen-0"><div class="eyebrow" id="startEyebrow"></div><h1 id="startTitle"></h1><p class="lead" id="startLead"></p><div class="panel"><button class="btn primary" id="startButton" type="button" onclick="go(1)"></button> <button class="btn secondary" id="loginButton" type="button" onclick="location.href='/login/'"></button></div></section><section id="screen-1" class="hidden"><div class="eyebrow" id="nameEyebrow"></div><h1 id="nameTitle"></h1><p class="lead" id="nameLead"></p><div class="panel"><div class="field"><label for="projectName" id="projectNameLabel"></label><input id="projectName"></div><div id="nameError" class="error hidden"></div></div><div class="actions"><button class="btn secondary" id="back1" type="button" onclick="go(0)"></button><button class="btn primary" id="next1" type="button" onclick="nextName()"></button></div></section><section id="screen-2" class="hidden"><div class="eyebrow" id="typeEyebrow"></div><h1 id="typeTitle"></h1><p class="lead" id="typeLead"></p><div class="panel grid" id="types"></div><div id="typeError" class="error hidden"></div><div class="actions"><button class="btn secondary" id="back2" type="button" onclick="go(1)"></button><button class="btn primary" id="next2" type="button" onclick="nextType()"></button></div></section><section id="screen-3" class="hidden"><div class="eyebrow" id="ownerEyebrow"></div><h1 id="ownerTitle"></h1><p class="lead" id="ownerLead"></p><div class="panel"><div class="field"><label for="ownerName" id="ownerNameLabel"></label><input id="ownerName" autocomplete="name"></div><div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="email"></div><div class="field"><label for="password" id="passwordLabel"></label><input id="password" type="password" autocomplete="new-password"></div><div id="ownerError" class="error hidden"></div><div id="apiError" class="api-error hidden" role="alert"></div></div><div class="actions"><button class="btn secondary" id="back3" type="button" onclick="go(2)"></button><button id="createButton" class="btn primary" type="button" onclick="createProject()"></button></div></section><section id="screen-4" class="hidden"><div class="eyebrow" id="creatingEyebrow"></div><h1 id="creatingTitle"></h1><p class="lead" id="creatingLead"></p><div class="status" id="status"></div></section><section id="screen-5" class="hidden"><div class="success">✓</div><div class="eyebrow" id="doneEyebrow"></div><h1><span id="resultName"></span> <span id="doneSuffix"></span></h1><p class="lead" id="doneLead"></p><div class="actions"><button class="btn primary" id="openButton" type="button" onclick="location.href='/workspace/'"></button></div></section></main></div></div></div><script src="/shared/i18n.js"></script><script>const copy={ru:{title:'Lk_uni — создать мой проект',steps:['Начало','Название проекта','Направление','Владелец','Создание'],s ject',login:'Sign in',nameEyebrow:'Step 1 of 4',nameTitle:'What is your project called?',nameLead:'Employees and customers will see this name.',projectName:'Project name',projectPlaceholder:'For example, My Project',nameError:'Enter a project name.',typeEyebrow:'Step 2 of 4',typeTitle:'What does your project do?',typeLead:'Choose the closest option. You can change the settings later.',typeError:'Choose a project category.',ownerEyebrow:'Step 3 of 4',ownerTitle:'Create the project owner',ownerLead:'These details will be used for the first sign in.',ownerName:'Name',ownerPlaceholder:'Alexander',password:'Password',passwordPlaceholder:'At least 8 characters',ownerError:'Enter a name, valid email, and a password of at least 8 characters.',back:'Back',next:'Continue',create:'Create project',creatingEyebrow:'Step 4 of 4',creatingTitle:'Creating your project…',creatingLead:'This usually takes a few seconds.',connecting:'Connecting to the platform…',ready:['✓ Organization created','✓ Owner created','✓ Access configured','✓ Workspace ready'],doneEyebrow:'Done',doneSuffix:'created',doneLead:'Your workspace is ready. You are already signed in as the owner.',open:'Open project',types:[['🍦','Vending','vending'],['🛒','Online store','ecommerce'],['🏥','Medical center','medical'],['🏭','Manufacturing','manufacturing'],['🔧','Services','services'],['📦','Other','other']]}};const state={step:0,type:null,workspace:null};function c(){return copy[LkUniI18n.current()]||copy.ru}function renderSteps(){const t=c();steps.innerHTML=t.steps.map((x,i)=>`<div class="step ${i===state.step?'active':''} ${i<state.step?'done':''}"><span>${i<state.step?'✓':i+1}</span>${x}</div>`).join('')}function render(){const t=c();document.title=t.title;startEyebrow.textContent=t.startEyebrow;startTitle.textContent=t.startTitle;startLead.textContent=t.startLead;startButton.textContent=t.start;loginButton.textContent=t.login;nameEyebrow.textContent=t.nameEyebrow;nameTitle.textContent=t.nameTitle;nameLead.textContent=t.nameLead;projectNameLabel.textContent=t.projectName;projectName.placeholder=t.projectPlaceholder;nameError.textContent=t.nameError;typeEyebrow.textContent=t.typeEyebrow;typeTitle.textContent=t.typeTitle;typeLead.textContent=t.typeLead;typeError.textContent=t.typeError;ownerEyebrow.textContent=t.ownerEyebrow;ownerTitle.textContent=t.ownerTitle;ownerLead.textContent=t.ownerLead;ownerNameLabel.textContent=t.ownerName;ownerName.placeholder=t.ownerPlaceholder;passwordLabel.textContent=t.password;password.placeholder=t.passwordPlaceholder;ownerError.textContent=t.ownerError;back1.textContent=back2.textContent=back3.textContent=t.back;next1.textContent=next2.textContent=t.next;createButton.textContent=t.create;creatingEyebrow.textContent=t.creatingEyebrow;creatingTitle.textContent=t.creatingTitle;creatingLead.textContent=t.creatingLead;doneEyebrow.textContent=t.doneEyebrow;doneSuffix.textContent=t.doneSuffix;doneLead.textContent=t.doneLead;openButton.textContent=t.open;types.innerHTML=t.types.map(([icon,label,value])=>`<button class="card ${state.type===value?'selected':''}" type="button" data-type="${value}"><span style="font-size:28px">${icon}</span><b>${label}</b></button>`).join('');renderSteps()}function go(n){document.querySelectorAll('main section').forEach(s=>s.classList.add('hidden'));document.getElementById('screen-'+n).classList.remove('hidden');state.step=Math.min(n,4);renderSteps()}function nextName(){const v=projectName.value.trim();nameError.classList.toggle('hidden',!!v);if(v)go(2)}function nextType(){typeError.classList.toggle('hidden',!!state.type);if(state.type)go(3)}function setApiError(message){apiError.textContent=message||'';apiError.classList.toggle('hidden',!message)}function clearStoredSession(){['lkuni.accessToken','lkuni.refreshToken','lkuni.user','lkuni.workspace','lk_uni_access_token','lk_uni_refresh_token','lk_uni_workspace'].forEach(k=>{localStorage.removeItem(k);sessionStorage.removeItem(k)})}function storeSession(payload){clearStoredSession();localStorage.setItem('lkuni.accessToken',payload.tokens?.accessToken||'');localStorage.setItem('lkuni.refreshToken',payload.tokens?.refreshToken||'');localStorage.setItem('lkuni.user',JSON.stringify(payload.user||payload.owner||{}));localStorage.setItem('lkuni.workspace',JSON.stringify(payload.workspace||{}))}async function createProject(){const t=c(),name=projectName.value.trim(),owner=ownerName.value.trim(),mail=email.value.trim(),pass=password.value;const valid=owner&&/^\S+@\S+\.\S+$/.test(mail)&&pass.length>=8;ownerError.classList.toggle('hidden',valid);if(!valid)return;setApiError('');createButton.disabled=true;go(4);status.innerHTML='<div>'+t.connecting+'</div>';try{const response=await fetch('/api/v1/projects',{method:'POST',headers:{'content-type':'application/json','x-device-name':'Project creation wizard'},body:JSON.stringify({projectName:name,businessType:state.type,deploymentMode:'cloud',owner:{name:owner,email:mail,password:pass,consents:{personalData:true}}})});const payload=await response.json().catch(()=>({}));if(!response.ok)throw new Error(payload.error||'Unable to create project.');state.workspace=payload.workspace;storeSession(payload);status.innerHTML=t.ready.map(x=>'<div>'+x+'</div>').join('');setTimeout(finish,350)}catch(error){go(3);setApiError(error.message)}finally{createButton.disabled=false}}function finish(){const name=state.workspace?.name||projectName.value.trim();resultName.textContent='«'+name+'»';go(5)}types.addEventListener('click',event=>{const card=event.target.closest('.card');if(!card)return;state.type=card.dataset.type;render()});LkUniI18n.bindButton(lang);document.addEventListener('lkuni:language',render);render();</script></body></html>
