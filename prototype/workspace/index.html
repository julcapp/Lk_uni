<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lk_uni</title>
  <style>:root{font-family:Inter,Arial,sans-serif;color:#172033;background:#f4f7fb}*{box-sizing:border-box}body{margin:0;background:#f4f7fb}.top{height:68px;background:#fff;border-bottom:1px solid #e6ebf2;display:flex;align-items:center;justify-content:space-between;padding:0 28px}.brand{font-size:22px;font-weight:800}.user{display:flex;gap:10px;align-items:center}.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:800;cursor:pointer}.logout{background:#edf1f7;color:#26334b}.lang{background:#fff;border:1px solid #dce3ee}.layout{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 68px)}.side{background:#fff;border-right:1px solid #e6ebf2;padding:24px 18px}.nav{display:grid;gap:8px}.nav a{padding:12px 14px;border-radius:12px;color:#465166;text-decoration:none;font-weight:700}.nav a.active,.nav a:hover{background:#eef4ff;color:#2458d3}.main{padding:34px}.eyebrow{color:#2458d3;font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}h1{font-size:38px;margin:10px 0 8px}.lead{color:#667085;margin:0 0 28px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.card{display:block;background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:22px;text-decoration:none;color:inherit}.card[href]:hover{border-color:#b9c9ec;box-shadow:0 8px 24px rgba(36,88,211,.08)}.card h2{margin:0 0 8px;font-size:21px}.card p{margin:0;color:#667085}.badge{display:inline-flex;margin-top:14px;padding:6px 9px;border-radius:999px;font-size:12px;font-weight:800;background:#eef4ff;color:#2458d3}.badge.ok{background:#ecfdf3;color:#027a48}.badge.wait{background:#fff7e6;color:#a15c00}.status{margin-top:28px;background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:22px}.status ul{margin:12px 0 0;padding-left:20px;color:#465166}.error{max-width:680px;margin:80px auto;background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:28px;text-align:center}.hidden{display:none}@media(max-width:800px){.layout{grid-template-columns:1fr}.side{display:none}.main{padding:24px}.grid{grid-template-columns:1fr}.top{padding:0 18px}}</style>
</head>
<body>
<header class="top"><div class="brand">Lk_uni</div><div class="user"><span id="userName"></span><button id="langButton" class="btn lang" type="button"></button><button id="logoutButton" class="btn logout"></button></div></header>
<div id="protected" class="layout hidden"><aside class="side"><nav class="nav"><a id="navHome" class="active" href="/workspace/"></a><a id="navProfile" href="/profile/"></a><a id="navOrganization" href="/organization/"></a><a id="navMembers" href="#"></a></nav></aside><main class="main"><div id="eyebrow" class="eyebrow"></div><h1 id="workspaceName"></h1><p id="lead" class="lead"></p><div class="grid"><a class="card" href="/profile/"><h2 id="profileTitle"></h2><p id="profileText"></p><span id="profileBadge" class="badge wait"></span></a><a class="card" href="/organization/"><h2 id="organizationTitle"></h2><p id="organizationText"></p><span id="organizationBadge" class="badge wait"></span></a><section class="card"><h2 id="membersTitle"></h2><p id="membersText"></p><span id="membersBadge" class="badge"></span></section><section class="card"><h2 id="clientsTitle"></h2><p id="clientsText"></p><span id="clientsBadge" class="badge"></span></section></div><section class="status"><strong id="statusTitle"></strong><ul id="statusList"></ul></section></main></div>
<section id="sessionError" class="error hidden"><h1 id="sessionTitle"></h1><p id="sessionText"></p><button id="sessionButton" class="btn" onclick="location.href='/login/'"></button></section>
<script src="/shared/i18n.js"></script>
<script>
const T={ru:{title:'Lk_uni — рабочее пространство',logout:'Выйти',home:'Главная',profile:'Профиль',organization:'Организация',members:'Участники',eyebrow:'Рабочее пространство',project:'Ваш проект',lead:'Центр управления базовыми настройками проекта.',profileTitle:'Профиль владельца',profileText:'Имя, email, язык, часовой пояс и безопасность учётной записи.',organizationTitle:'Организация',organizationText:'Название, описание, контакты и параметры организации.',membersTitle:'Участники',membersText:'Добавление сотрудников и настройка ролей.',clientsTitle:'Клиенты',clientsText:'Пользовательские данные подключаемых проектов.',next:'Следующий этап',checking:'Проверяем…',ready:'Настроено',needs:'Требует заполнения',statusTitle:'Готовность рабочего пространства',status:['Рабочее пространство создано.','Владелец назначен.','Сессия активна.'],profileOk:'Профиль владельца настроен.',profileNeed:'Заполните профиль владельца.',orgOk:'Организация настроена.',orgNeed:'Заполните данные организации.',owner:'Владелец',sessionTitle:'Сессия не найдена',sessionText:'Войдите снова, чтобы открыть рабочее пространство.',sessionButton:'Перейти ко входу',sessionEnded:'Сессия завершена',requestError:'Ошибка запроса'},en:{title:'Lk_uni — workspace',logout:'Sign out',home:'Home',profile:'Profile',organization:'Organization',members:'Members',eyebrow:'Workspace',project:'Your project',lead:'Manage the core settings of your project.',profileTitle:'Owner profile',profileText:'Name, email, language, time zone and account security.',organizationTitle:'Organization',organizationText:'Name, description, contacts and organization settings.',membersTitle:'Members',membersText:'Add employees and configure roles.',clientsTitle:'Clients',clientsText:'User data for connected projects.',next:'Next stage',checking:'Checking…',ready:'Configured',needs:'Needs attention',statusTitle:'Workspace readiness',status:['Workspace created.','Owner assigned.','Session active.'],profileOk:'Owner profile configured.',profileNeed:'Complete the owner profile.',orgOk:'Organization configured.',orgNeed:'Complete organization details.',owner:'Owner',sessionTitle:'Session not found',sessionText:'Sign in again to open the workspace.',sessionButton:'Go to sign in',sessionEnded:'Session ended',requestError:'Request failed'}};
function tr(){return T[LkUniI18n.current()]||T.ru}function renderStatic(){const t=tr();document.title=t.title;logoutButton.textContent=t.logout;navHome.textContent=t.home;navProfile.textContent=t.profile;navOrganization.textContent=t.organization;navMembers.textContent=t.members;eyebrow.textContent=t.eyebrow;lead.textContent=t.lead;profileTitle.textContent=t.profileTitle;profileText.textContent=t.profileText;organizationTitle.textContent=t.organizationTitle;organizationText.textContent=t.organizationText;membersTitle.textContent=t.membersTitle;membersText.textContent=t.membersText;clientsTitle.textContent=t.clientsTitle;clientsText.textContent=t.clientsText;membersBadge.textContent=t.next;clientsBadge.textContent=t.next;statusTitle.textContent=t.statusTitle;sessionTitle.textContent=t.sessionTitle;sessionText.textContent=t.sessionText;sessionButton.textContent=t.sessionButton;if(!workspaceName.textContent)workspaceName.textContent=t.project;LkUniI18n.bindButton(langButton)}
function pickStorage(){if(localStorage.getItem('lkuni.accessToken'))return localStorage;if(sessionStorage.getItem('lkuni.accessToken'))return sessionStorage;return null}const storage=pickStorage();const protectedBlock=document.getElementById('protected'),errorBlock=document.getElementById('sessionError');function clearSession(){['lkuni.accessToken','lkuni.refreshToken','lkuni.user','lkuni.workspace'].forEach(k=>{localStorage.removeItem(k);sessionStorage.removeItem(k)})}async function api(url){const r=await fetch(url,{headers:{authorization:'Bearer '+storage.getItem('lkuni.accessToken')}});const data=await r.json().catch(()=>({}));if(r.status===401){clearSession();location.href='/login/';throw new Error(tr().sessionEnded)}if(!r.ok)throw new Error(data.error||tr().requestError);return data}function setBadge(id,ready){const el=document.getElementById(id);el.textContent=ready?tr().ready:tr().needs;el.className='badge '+(ready?'ok':'wait')}async function syncLanguage(){try{const p=await api('/api/v1/profile/settings');const lang=(p.settings||p).language;if(lang&&lang!==LkUniI18n.current())LkUniI18n.set(lang)}catch{}}
async function loadDashboard(){let pr=false,or=false;try{const p=await api('/api/v1/profile');const u=p.user||{};pr=Boolean((u.displayName||'').trim()&&u.email);setBadge('profileBadge',pr)}catch{setBadge('profileBadge',false)}try{const o=await api('/api/v1/organization');const org=o.organization||o;or=Boolean((org.name||'').trim());setBadge('organizationBadge',or)}catch{setBadge('organizationBadge',false)}const t=tr();const items=[...t.status,pr?t.profileOk:t.profileNeed,or?t.orgOk:t.orgNeed];statusList.innerHTML=items.map(x=>'<li>'+x+'</li>').join('')}
async function start(){renderStatic();if(!storage){errorBlock.classList.remove('hidden');return}let user={},workspace={};try{user=JSON.parse(storage.getItem('lkuni.user')||'{}');workspace=JSON.parse(storage.getItem('lkuni.workspace')||'{}')}catch{}userName.textContent=user.displayName||user.display_name||tr().owner;workspaceName.textContent=workspace.name||tr().project;protectedBlock.classList.remove('hidden');await syncLanguage();renderStatic();userName.textContent=user.displayName||user.display_name||tr().owner;workspaceName.textContent=workspace.name||tr().project;await loadDashboard()}
document.addEventListener('lkuni:language',()=>{renderStatic();loadDashboard()});logoutButton.addEventListener('click',async()=>{if(!storage){location.href='/login/';return}const rt=storage.getItem('lkuni.refreshToken');try{if(rt)await fetch('/api/v1/auth/logout',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({refreshToken:rt})})}finally{clearSession();location.href='/login/'}});start();
</script></body></html>
