<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lk_uni</title><style>:root{font-family:Inter,Arial,sans-serif;color:#172033;background:#f4f7fb}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#eef4ff,#f8fbff 48%,#f7f5ff)}button,input{font:inherit}.shell{min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(460px,100%);background:#fff;border:1px solid #e5eaf2;border-radius:26px;box-shadow:0 30px 80px rgba(35,54,95,.13);padding:34px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:30px}.brand{font-weight:800;font-size:22px}.lang{border:1px solid #dce3ee;background:#fff;border-radius:12px;padding:9px 12px}.eyebrow{color:#2458d3;font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.08em}h1{font-size:34px;margin:10px 0 12px}.lead{color:#667085;margin:0 0 26px}.field{display:grid;gap:8px;margin-bottom:18px}.field label{font-weight:700}.field input{padding:14px 15px;border:1px solid #ccd5e2;border-radius:13px;outline:none}.field input:focus{border-color:#2458d3;box-shadow:0 0 0 4px rgba(36,88,211,.1)}.btn{width:100%;border:0;border-radius:14px;padding:14px 20px;background:#2458d3;color:#fff;font-weight:800;cursor:pointer}.btn:disabled{opacity:.65}.alert{padding:12px 14px;border-radius:12px;margin-bottom:18px;background:#fff0ef;color:#b42318}.success{padding:14px;border-radius:14px;background:#eefaf2;color:#177245;margin:18px 0}.hidden{display:none}.footer{margin-top:22px;text-align:center}.link{color:#2458d3;text-decoration:none;font-weight:700}.demo{margin-top:14px;padding:12px;background:#f4f7fb;border-radius:12px;word-break:break-all;font-size:13px}@media(max-width:520px){.card{padding:26px 22px}h1{font-size:30px}}</style></head><body><div class="shell"><main class="card"><div class="top"><div class="brand">Lk_uni</div><button class="lang" id="lang" type="button"></button></div><section id="formPanel"><div class="eyebrow" id="eyebrow"></div><h1 id="title"></h1><p class="lead" id="lead"></p><div id="alert" class="alert hidden" role="alert"></div><form id="form"><div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required placeholder="name@example.ru"></div><button id="submit" class="btn" type="submit"></button></form></section><section id="donePanel" class="hidden"><div class="eyebrow" id="doneEyebrow"></div><h1 id="doneTitle"></h1><div class="success" id="doneText"></div><div id="demoLink" class="demo hidden"></div></section><div class="footer"><a class="link" id="backLink" href="/login/"></a></div></main></div><script src="/shared/i18n.js"></script><script>const copy={ru:{title:'Lk_uni — восстановление пароля',eyebrow:'Восстановление доступа',heading:'Забыли пароль?',lead:'Введите email, который использовали при создании проекта.',submit:'Отправить инструкции',working:'Отправляем…',invalid:'Введите корректный email.',failed:'Не удалось отправить запрос.',doneEyebrow:'Готово',doneTitle:'Проверьте почту',doneText:'Если такой адрес зарегистрирован, инструкции по восстановлению отправлены на электронную почту.',demo:'Тестовая ссылка: продолжить восстановление',back:'← Вернуться ко входу'},en:{title:'Lk_uni — password recovery',eyebrow:'Account recovery',heading:'Forgot your password?',lead:'Enter the email used when creating the project.',submit:'Send instructions',working:'Sending…',invalid:'Enter a valid email.',failed:'Unable to send the request.',doneEyebrow:'Done',doneTitle:'Check your email',doneText:'If this address is registered, password recovery instructions have been sent by email.',demo:'Test link: continue recovery',back:'← Back to sign in'}};function c(){return copy[LkUniI18n.current()]||copy.ru}function render(){const t=c();document.title=t.title;eyebrow.textContent=t.eyebrow;title.textContent=t.heading;lead.textContent=t.lead;submit.textContent=t.submit;doneEyebrow.textContent=t.doneEyebrow;doneTitle.textContent=t.doneTitle;doneText.textContent=t.doneText;backLink.textContent=t.back}LkUniI18n.bindButton(lang);document.addEventListener('lkuni:language',render);render();const form=document.getElementById('form'),alertBox=document.getElementById('alert'),button=document.getElementById('submit');form.addEventListener('submit',async(e)=>{e.preventDefault();alertBox.classList.add('hidden');const mail=email.value.trim();if(!/^\S+@\S+\.\S+$/.test(mail)){alertBox.textContent=c().invalid;alertBox.classList.remove('hidden');return}button.disabled=true;button.textContent=c().working;try{const r=await fetch('/api/v1/auth/password-reset/request',{method:'POST',headers:{'content-type':'application/json','x-device-name':'Lk_uni Web'},body:JSON.stringify({email:mail})});const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.error||c().failed);formPanel.classList.add('hidden');donePanel.classList.remove('hidden');if(data.resetUrl){demoLink.classList.remove('hidden');demoLink.innerHTML='<a class="link" href="'+data.resetUrl+'">'+c().demo+'</a>'}}catch(err){alertBox.textContent=err.message;alertBox.classList.remove('hidden')}finally{button.disabled=false;button.textContent=c().submit}});</script></body></html>
