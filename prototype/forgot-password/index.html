<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lk_uni — восстановление пароля</title>
<style>
:root{font-family:Inter,Arial,sans-serif;color:#172033;background:#f4f7fb}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#eef4ff,#f8fbff 48%,#f7f5ff)}button,input{font:inherit}.shell{min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(460px,100%);background:#fff;border:1px solid #e5eaf2;border-radius:26px;box-shadow:0 30px 80px rgba(35,54,95,.13);padding:34px}.brand{font-weight:800;font-size:22px;margin-bottom:30px}.eyebrow{color:#2458d3;font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.08em}h1{font-size:34px;margin:10px 0 12px}.lead{color:#667085;margin:0 0 26px}.field{display:grid;gap:8px;margin-bottom:18px}.field label{font-weight:700}.field input{padding:14px 15px;border:1px solid #ccd5e2;border-radius:13px;outline:none}.field input:focus{border-color:#2458d3;box-shadow:0 0 0 4px rgba(36,88,211,.1)}.btn{width:100%;border:0;border-radius:14px;padding:14px 20px;background:#2458d3;color:#fff;font-weight:800;cursor:pointer}.btn:disabled{opacity:.65}.alert{padding:12px 14px;border-radius:12px;margin-bottom:18px;background:#fff0ef;color:#b42318}.success{padding:14px;border-radius:14px;background:#eefaf2;color:#177245;margin:18px 0}.hidden{display:none}.footer{margin-top:22px;text-align:center}.link{color:#2458d3;text-decoration:none;font-weight:700}.demo{margin-top:14px;padding:12px;background:#f4f7fb;border-radius:12px;word-break:break-all;font-size:13px}@media(max-width:520px){.card{padding:26px 22px}h1{font-size:30px}}
</style>
</head>
<body><div class="shell"><main class="card">
<div class="brand">Lk_uni</div>
<section id="formPanel"><div class="eyebrow">Восстановление доступа</div><h1>Забыли пароль?</h1><p class="lead">Введите email, который использовали при создании проекта.</p><div id="alert" class="alert hidden" role="alert"></div><form id="form"><div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required placeholder="name@example.ru"></div><button id="submit" class="btn" type="submit">Отправить инструкции</button></form></section>
<section id="donePanel" class="hidden"><div class="eyebrow">Готово</div><h1>Проверьте почту</h1><div class="success">Если такой адрес зарегистрирован, инструкции по восстановлению отправлены на электронную почту.</div><div id="demoLink" class="demo hidden"></div></section>
<div class="footer"><a class="link" href="/login/">← Вернуться ко входу</a></div>
</main></div>
<script>
const form=document.getElementById('form'),alertBox=document.getElementById('alert'),button=document.getElementById('submit');
form.addEventListener('submit',async(e)=>{e.preventDefault();alertBox.classList.add('hidden');const email=document.getElementById('email').value.trim();if(!/^\S+@\S+\.\S+$/.test(email)){alertBox.textContent='Введите корректный email.';alertBox.classList.remove('hidden');return}button.disabled=true;button.textContent='Отправляем…';try{const r=await fetch('/api/v1/auth/password-reset/request',{method:'POST',headers:{'content-type':'application/json','x-device-name':'Lk_uni Web'},body:JSON.stringify({email})});const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.error||'Не удалось отправить запрос.');document.getElementById('formPanel').classList.add('hidden');document.getElementById('donePanel').classList.remove('hidden');if(data.resetUrl){const box=document.getElementById('demoLink');box.classList.remove('hidden');box.innerHTML='Тестовая ссылка: <a class="link" href="'+data.resetUrl+'">продолжить восстановление</a>'}}catch(err){alertBox.textContent=err.message;alertBox.classList.remove('hidden')}finally{button.disabled=false;button.textContent='Отправить инструкции'}});
</script>
</body></html>
